<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Invoice Studio</title><meta name="description" content="Create, brand and manage professional invoices"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/enhancements.css"></head><body>
<div id="toast" role="status" aria-live="polite"></div>
<main id="auth" class="auth-wrap"><div class="auth-art"><span class="eyebrow">INVOICE STUDIO</span><h1>Beautiful invoices.<br><em>Business as usual.</em></h1><p>Your customers, branding and payment details, ready for every invoice.</p><div class="art-paper"><div class="art-line"></div><div class="art-title">INVOICE <span>№ 0001</span></div><div class="art-bars"><i></i><i></i><i></i></div><div class="art-total">TOTAL DUE <b>R 12 450.00</b></div></div></div><div class="auth-card"><div class="wordmark"><span class="mark">◩</span> Invoice Studio</div><h2 id="authTitle">Welcome back</h2><p class="sub" id="authSub">Sign in to manage your invoices.</p><form id="authForm"><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="12" autocomplete="current-password" required></label><button class="primary wide" type="submit" id="authSubmit">Sign in</button></form><p class="switch" id="authSwitch">New here? <button type="button" class="link" id="switchAuth">Create an account</button></p></div></main>
<div id="app" hidden><aside class="sidebar" id="businessSidebar"><div class="wordmark"><span class="mark">◩</span> Invoice Studio</div><div class="side-label">WORKSPACE</div><nav aria-label="Main navigation"><button data-nav="dashboard" class="nav active">▦ <span>Overview</span></button><button data-nav="invoices" class="nav">▤ <span>Invoices</span></button><button data-nav="quotations" class="nav">▧ <span>Quotations</span></button><button data-nav="customers" class="nav">◉ <span>Customers</span></button><button data-nav="products" class="nav">◫ <span>Products & services</span></button><button data-nav="business" class="nav">◇ <span>Business & brand</span></button></nav><div class="side-bottom"><div class="business-switch"><label for="businessSelect">ACTIVE BUSINESS</label><select id="businessSelect"></select></div><button id="signOut" class="nav">↪ <span>Sign out</span></button></div></aside><div class="main-shell"><header class="topbar"><button id="mobileMenu" aria-label="Open menu" aria-controls="businessSidebar" aria-expanded="false">☰</button><div id="breadcrumb">Overview</div><div class="top-actions"><span id="userEmail"></span><button id="themeToggle" class="secondary" aria-label="Toggle light or dark theme" title="Toggle theme">☾</button><button class="primary" id="topNew">＋ New invoice</button></div></header><main id="content" class="content"></main></div></div>
<template id="modalTemplate"><div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2></h2><button class="icon close" aria-label="Close dialog">×</button></div><div class="modal-body"></div><div class="modal-actions"></div></div></div></template>
<script src="/finance.js" defer></script><script src="/document.js" defer></script><script src="/app.js" defer></script><script src="/editor.js" defer></script><script src="/workspace.js" defer></script></body></html>
